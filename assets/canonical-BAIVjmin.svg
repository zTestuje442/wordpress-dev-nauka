<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title">
<title id="title">Duplikaty i canonical: kilka adresów z tą samą treścią wskazuje tagiem canonical jeden główny adres, który Google pokazuje w wynikach</title>
<style>
svg{--fg:#1d1d1b;--muted:#6b6b66;--box:#ffffff;--line:#c9c9c1;--accent:#2b6cb0;--site:#2f8f4e;--bad:#c0392b;font-family:system-ui,sans-serif}
@media (prefers-color-scheme:dark){svg{--fg:#ecece6;--muted:#a0a09a;--box:#1f1f1d;--line:#4a4a44;--accent:#63a4ec;--site:#5cbf7d;--bad:#ec7f72}}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.box.good{stroke:var(--site);stroke-width:2}
.box.bad{stroke:var(--bad);stroke-width:2}
.t{fill:var(--fg);font-size:16px;font-weight:700}
.s{fill:var(--muted);font-size:13px}
.ar{stroke:var(--line);stroke-width:2}
#m path{fill:var(--line)}
.tag{fill:var(--accent);font-size:14px;font-weight:700}
.tag.good{fill:var(--site)}
.tag.bad{fill:var(--bad)}
.hl{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.cap{fill:var(--fg);font-size:15px;opacity:0}
.static{fill:var(--muted);font-size:14px;opacity:0}
@keyframes c0{0%{opacity:0}0.00%{opacity:1}33.33%{opacity:0}66.67%{opacity:0}100%{opacity:0}}.c0{animation:c0 9s step-end infinite}@keyframes c1{0%{opacity:0}0.00%{opacity:0}33.33%{opacity:1}66.67%{opacity:0}100%{opacity:0}}.c1{animation:c1 9s step-end infinite}@keyframes c2{0%{opacity:0}0.00%{opacity:0}33.33%{opacity:0}66.67%{opacity:1}100%{opacity:0}}.c2{animation:c2 9s step-end infinite}@keyframes h_a{0%{opacity:0}0.00%{opacity:1}33.33%{opacity:0}66.67%{opacity:0}100%{opacity:0}}.h_a{animation:h_a 9s step-end infinite}@keyframes h_b{0%{opacity:0}0.00%{opacity:1}33.33%{opacity:0}66.67%{opacity:0}100%{opacity:0}}.h_b{animation:h_b 9s step-end infinite}@keyframes h_c{0%{opacity:0}0.00%{opacity:0}33.33%{opacity:1}66.67%{opacity:0}100%{opacity:0}}.h_c{animation:h_c 9s step-end infinite}@keyframes h_g{0%{opacity:0}0.00%{opacity:0}33.33%{opacity:0}66.67%{opacity:1}100%{opacity:0}}.h_g{animation:h_g 9s step-end infinite}
@media (prefers-reduced-motion:reduce){.cap,.hl{animation:none;opacity:0}.static{opacity:1}}
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<line class="ar" x1="180" y1="75" x2="298" y2="135" marker-end="url(#m)"/><line class="ar" x1="180" y1="225" x2="298" y2="160" marker-end="url(#m)"/><line class="ar" x1="460" y1="150" x2="578" y2="150" marker-end="url(#m)"/>
<rect class="hl h_a" x="16" y="36" width="168" height="78" rx="13"/><rect class="box " x="20" y="40" width="160" height="70" rx="10"/><text class="t" x="100" y="72" text-anchor="middle">?utm_source=fb</text><text class="s" x="100" y="92" text-anchor="middle">ten sam produkt</text><rect class="hl h_b" x="16" y="186" width="168" height="78" rx="13"/><rect class="box " x="20" y="190" width="160" height="70" rx="10"/><text class="t" x="100" y="222" text-anchor="middle">/kategoria/buty/</text><text class="s" x="100" y="242" text-anchor="middle">ten sam produkt</text><rect class="hl h_c" x="296" y="111" width="168" height="78" rx="13"/><rect class="box " x="300" y="115" width="160" height="70" rx="10"/><text class="t" x="380" y="147" text-anchor="middle">rel=canonical</text><text class="s" x="380" y="167" text-anchor="middle">wskazuje główny</text><rect class="hl h_g" x="576" y="111" width="168" height="78" rx="13"/><rect class="box good" x="580" y="115" width="160" height="70" rx="10"/><text class="t" x="660" y="147" text-anchor="middle">/produkt/buty-x/</text><text class="s" x="660" y="167" text-anchor="middle">adres w Google</text>
<text class="cap c0" x="380" y="310" text-anchor="middle">1. Ta sama treść jest dostępna pod kilkoma adresami</text><text class="cap c1" x="380" y="310" text-anchor="middle">2. Każdy z nich ma w kodzie tag canonical z głównym adresem</text><text class="cap c2" x="380" y="310" text-anchor="middle">3. Google łączy sygnały i pokazuje w wynikach główny adres</text>
<text class="static" x="380" y="310" text-anchor="middle">Kilka adresów z tą samą treścią → canonical → jeden adres w Google</text>
</svg>
