<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title">
<title id="title">Hooki: WordPress buduje stronę krok po kroku i w wybranych momentach pyta, czy ktoś chce coś dodać (akcja) albo zmienić (filtr)</title>
<style>
svg{--fg:#1d1d1b;--muted:#6b6b66;--box:#ffffff;--line:#c9c9c1;--accent:#2b6cb0;--site:#2f8f4e;--bad:#c0392b;font-family:system-ui,sans-serif}
@media (prefers-color-scheme:dark){svg{--fg:#ecece6;--muted:#a0a09a;--box:#1f1f1d;--line:#4a4a44;--accent:#63a4ec;--site:#5cbf7d;--bad:#ec7f72}}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.box.good{stroke:var(--site);stroke-width:2}
.box.bad{stroke:var(--bad);stroke-width:2}
.t{fill:var(--fg);font-size:16px;font-weight:700}
.s{fill:var(--muted);font-size:13px}
.ar{stroke:var(--line);stroke-width:2}
#m path{fill:var(--line)}
.tag{fill:var(--accent);font-size:14px;font-weight:700}
.tag.good{fill:var(--site)}
.tag.bad{fill:var(--bad)}
.hl{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.cap{fill:var(--fg);font-size:15px;opacity:0}
.static{fill:var(--muted);font-size:14px;opacity:0}
@keyframes c0{0%{opacity:0}0.00%{opacity:1}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.c0{animation:c0 15s step-end infinite}@keyframes c1{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:1}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.c1{animation:c1 15s step-end infinite}@keyframes c2{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:1}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.c2{animation:c2 15s step-end infinite}@keyframes c3{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:1}80.00%{opacity:0}100%{opacity:0}}.c3{animation:c3 15s step-end infinite}@keyframes c4{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:1}100%{opacity:0}}.c4{animation:c4 15s step-end infinite}@keyframes h_a{0%{opacity:0}0.00%{opacity:1}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.h_a{animation:h_a 15s step-end infinite}@keyframes h_s{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:1}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.h_s{animation:h_s 15s step-end infinite}@keyframes h_h{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:1}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.h_h{animation:h_h 15s step-end infinite}@keyframes h_k{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:1}80.00%{opacity:0}100%{opacity:0}}.h_k{animation:h_k 15s step-end infinite}@keyframes h_w{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:1}100%{opacity:0}}.h_w{animation:h_w 15s step-end infinite}
@media (prefers-reduced-motion:reduce){.cap,.hl{animation:none;opacity:0}.static{opacity:1}}
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<line class="ar" x1="180" y1="75" x2="298" y2="75" marker-end="url(#m)"/><line class="ar" x1="460" y1="75" x2="578" y2="75" marker-end="url(#m)"/><line class="ar" x1="660" y1="110" x2="660" y2="188" marker-end="url(#m)"/><line class="ar" x1="578" y1="225" x2="462" y2="225" marker-end="url(#m)"/>
<rect class="hl h_a" x="16" y="36" width="168" height="78" rx="13"/><rect class="box " x="20" y="40" width="160" height="70" rx="10"/><text class="t" x="100" y="72" text-anchor="middle">Adres</text><text class="s" x="100" y="92" text-anchor="middle">/oferta/remont/</text><rect class="hl h_s" x="296" y="36" width="168" height="78" rx="13"/><rect class="box " x="300" y="40" width="160" height="70" rx="10"/><text class="t" x="380" y="72" text-anchor="middle">Szablon</text><text class="s" x="380" y="92" text-anchor="middle">page.php lub single.php</text><rect class="hl h_h" x="576" y="36" width="168" height="78" rx="13"/><rect class="box " x="580" y="40" width="160" height="70" rx="10"/><text class="t" x="660" y="72" text-anchor="middle">Hook</text><text class="s" x="660" y="92" text-anchor="middle">np. wp_footer</text><rect class="hl h_k" x="576" y="186" width="168" height="78" rx="13"/><rect class="box good" x="580" y="190" width="160" height="70" rx="10"/><text class="t" x="660" y="222" text-anchor="middle">Twój kod</text><text class="s" x="660" y="242" text-anchor="middle">add_action / add_filter</text><rect class="hl h_w" x="296" y="186" width="168" height="78" rx="13"/><rect class="box " x="300" y="190" width="160" height="70" rx="10"/><text class="t" x="380" y="222" text-anchor="middle">Strona</text><text class="s" x="380" y="242" text-anchor="middle">gotowy HTML</text>
<text class="cap c0" x="380" y="310" text-anchor="middle">1. Odwiedzający wchodzi pod adres strony</text><text class="cap c1" x="380" y="310" text-anchor="middle">2. WordPress wybiera szablon według hierarchii szablonów</text><text class="cap c2" x="380" y="310" text-anchor="middle">3. Podczas budowania strony mija hooki: punkty, w których można się wpiąć</text><text class="cap c3" x="380" y="310" text-anchor="middle">4. Twój kod podpięty do hooka dodaje coś lub zmienia</text><text class="cap c4" x="380" y="310" text-anchor="middle">5. Przeglądarka dostaje gotową stronę razem z Twoją zmianą</text>
<text class="static" x="380" y="310" text-anchor="middle">Adres → szablon → hooki → Twój kod → gotowa strona</text>
</svg>
