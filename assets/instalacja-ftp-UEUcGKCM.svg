<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title">
<title id="title">Instalacja WordPressa przez FTP: pliki z komputera trafiają na serwer, w panelu hostingu powstaje baza danych, a plik wp-config.php łączy pliki z bazą</title>
<style>
svg{--fg:#1d1d1b;--muted:#6b6b66;--box:#ffffff;--line:#c9c9c1;--accent:#2b6cb0;--site:#2f8f4e;font-family:system-ui,sans-serif}
@media (prefers-color-scheme:dark){svg{--fg:#ecece6;--muted:#a0a09a;--box:#1f1f1d;--line:#4a4a44;--accent:#63a4ec;--site:#5cbf7d}}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.t{fill:var(--fg);font-size:16px;font-weight:700}
.s{fill:var(--muted);font-size:13px}
.ar{stroke:var(--line);stroke-width:2}
#m path{fill:var(--line)}
.hl{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.cap{fill:var(--fg);font-size:15px;opacity:0}
.static{fill:var(--muted);font-size:14px;opacity:0}
@keyframes c0{0%{opacity:0}0.00%{opacity:0}0.01%{opacity:1}24.99%{opacity:1}25.00%{opacity:0}100%{opacity:0}}.c0{animation:c0 12s step-end infinite}@keyframes c1{0%{opacity:0}25.00%{opacity:0}25.01%{opacity:1}49.99%{opacity:1}50.00%{opacity:0}100%{opacity:0}}.c1{animation:c1 12s step-end infinite}@keyframes c2{0%{opacity:0}50.00%{opacity:0}50.01%{opacity:1}74.99%{opacity:1}75.00%{opacity:0}100%{opacity:0}}.c2{animation:c2 12s step-end infinite}@keyframes c3{0%{opacity:0}75.00%{opacity:0}75.01%{opacity:1}99.99%{opacity:1}100.00%{opacity:0}100%{opacity:0}}.c3{animation:c3 12s step-end infinite}@keyframes h0{0%{opacity:0}0.00%{opacity:1}25.00%{opacity:1}50.00%{opacity:0}75.00%{opacity:0}100%{opacity:0}}.h0{animation:h0 12s step-end infinite}@keyframes h1{0%{opacity:0}0.00%{opacity:0}25.00%{opacity:1}50.00%{opacity:0}75.00%{opacity:1}100%{opacity:0}}.h1{animation:h1 12s step-end infinite}@keyframes h2{0%{opacity:0}0.00%{opacity:0}25.00%{opacity:0}50.00%{opacity:1}75.00%{opacity:0}100%{opacity:0}}.h2{animation:h2 12s step-end infinite}@keyframes h3{0%{opacity:0}0.00%{opacity:0}25.00%{opacity:0}50.00%{opacity:1}75.00%{opacity:1}100%{opacity:0}}.h3{animation:h3 12s step-end infinite}@keyframes h4{0%{opacity:0}0.00%{opacity:0}25.00%{opacity:0}50.00%{opacity:0}75.00%{opacity:1}100%{opacity:0}}.h4{animation:h4 12s step-end infinite}
@media (prefers-reduced-motion:reduce){.cap,.hl{animation:none;opacity:0}.static{opacity:1}}
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<line class="ar" x1="180" y1="75" x2="294" y2="75" marker-end="url(#m)"/><text class="s" x="240.0" y="67" text-anchor="middle">SFTP</text><line class="ar" x1="180" y1="225" x2="294" y2="225" marker-end="url(#m)"/><text class="s" x="240.0" y="217" text-anchor="middle">tworzy</text><line class="ar" x1="460" y1="90" x2="574" y2="140" marker-end="url(#m)"/><line class="ar" x1="460" y1="225" x2="574" y2="165" marker-end="url(#m)"/>
<rect class="hl h0" x="16" y="36" width="168" height="78" rx="13"/><rect class="box" x="20" y="40" width="160" height="70" rx="10"/><text class="t" x="100" y="72" text-anchor="middle">Twój komputer</text><text class="s" x="100" y="92" text-anchor="middle">pliki z wordpress.org</text><rect class="hl h1" x="296" y="36" width="168" height="78" rx="13"/><rect class="box" x="300" y="40" width="160" height="70" rx="10"/><text class="t" x="380" y="72" text-anchor="middle">Serwer: pliki</text><text class="s" x="380" y="92" text-anchor="middle">public_html/</text><rect class="hl h2" x="16" y="186" width="168" height="78" rx="13"/><rect class="box" x="20" y="190" width="160" height="70" rx="10"/><text class="t" x="100" y="222" text-anchor="middle">Panel hostingu</text><text class="s" x="100" y="242" text-anchor="middle">nowa baza MySQL</text><rect class="hl h3" x="296" y="186" width="168" height="78" rx="13"/><rect class="box" x="300" y="190" width="160" height="70" rx="10"/><text class="t" x="380" y="222" text-anchor="middle">Baza danych</text><text class="s" x="380" y="242" text-anchor="middle">użytkownik + hasło</text><rect class="hl h4" x="576" y="111" width="168" height="78" rx="13"/><rect class="box" x="580" y="115" width="160" height="70" rx="10"/><text class="t" x="660" y="147" text-anchor="middle">wp-config.php</text><text class="s" x="660" y="167" text-anchor="middle">łączy pliki z bazą</text>
<text class="cap c0" x="380" y="310" text-anchor="middle">1. Pobierasz WordPressa z wordpress.org i rozpakowujesz</text><text class="cap c1" x="380" y="310" text-anchor="middle">2. Wysyłasz pliki na serwer przez SFTP (np. FileZilla)</text><text class="cap c2" x="380" y="310" text-anchor="middle">3. W panelu hostingu zakładasz bazę danych i użytkownika</text><text class="cap c3" x="380" y="310" text-anchor="middle">4. Instalator zapisuje dane bazy w wp-config.php i gotowe</text>
<text class="static" x="380" y="310" text-anchor="middle">Pliki na serwer (SFTP) + baza w panelu → wp-config.php je łączy</text>
</svg>
