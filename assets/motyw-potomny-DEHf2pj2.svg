<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title">
<title id="title">Motyw potomny: aktualizacja motywu rodzica nadpisuje zmiany zrobione w rodzicu, a zmiany w motywie potomnym zostają</title>
<style>
svg{--fg:#1d1d1b;--muted:#6b6b66;--box:#ffffff;--line:#c9c9c1;--accent:#2b6cb0;--site:#2f8f4e;--bad:#c0392b;font-family:system-ui,sans-serif}
@media (prefers-color-scheme:dark){svg{--fg:#ecece6;--muted:#a0a09a;--box:#1f1f1d;--line:#4a4a44;--accent:#63a4ec;--site:#5cbf7d;--bad:#ec7f72}}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.box.good{stroke:var(--site);stroke-width:2}
.box.bad{stroke:var(--bad);stroke-width:2}
.t{fill:var(--fg);font-size:16px;font-weight:700}
.s{fill:var(--muted);font-size:13px}
.ar{stroke:var(--line);stroke-width:2}
#m path{fill:var(--line)}
.tag{fill:var(--accent);font-size:14px;font-weight:700}
.tag.good{fill:var(--site)}
.tag.bad{fill:var(--bad)}
.hl{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.cap{fill:var(--fg);font-size:15px;opacity:0}
.static{fill:var(--muted);font-size:14px;opacity:0}
@keyframes c0{0%{opacity:0}0.00%{opacity:1}25.00%{opacity:0}50.00%{opacity:0}75.00%{opacity:0}100%{opacity:0}}.c0{animation:c0 12s step-end infinite}@keyframes c1{0%{opacity:0}0.00%{opacity:0}25.00%{opacity:1}50.00%{opacity:0}75.00%{opacity:0}100%{opacity:0}}.c1{animation:c1 12s step-end infinite}@keyframes c2{0%{opacity:0}0.00%{opacity:0}25.00%{opacity:0}50.00%{opacity:1}75.00%{opacity:0}100%{opacity:0}}.c2{animation:c2 12s step-end infinite}@keyframes c3{0%{opacity:0}0.00%{opacity:0}25.00%{opacity:0}50.00%{opacity:0}75.00%{opacity:1}100%{opacity:0}}.c3{animation:c3 12s step-end infinite}@keyframes h_r{0%{opacity:0}0.00%{opacity:1}25.00%{opacity:0}50.00%{opacity:0}75.00%{opacity:0}100%{opacity:0}}.h_r{animation:h_r 12s step-end infinite}@keyframes h_a{0%{opacity:0}0.00%{opacity:0}25.00%{opacity:1}50.00%{opacity:0}75.00%{opacity:0}100%{opacity:0}}.h_a{animation:h_a 12s step-end infinite}@keyframes h_x{0%{opacity:0}0.00%{opacity:0}25.00%{opacity:1}50.00%{opacity:0}75.00%{opacity:0}100%{opacity:0}}.h_x{animation:h_x 12s step-end infinite}@keyframes h_p{0%{opacity:0}0.00%{opacity:0}25.00%{opacity:0}50.00%{opacity:1}75.00%{opacity:0}100%{opacity:0}}.h_p{animation:h_p 12s step-end infinite}@keyframes h_a2{0%{opacity:0}0.00%{opacity:0}25.00%{opacity:0}50.00%{opacity:0}75.00%{opacity:1}100%{opacity:0}}.h_a2{animation:h_a2 12s step-end infinite}@keyframes h_ok{0%{opacity:0}0.00%{opacity:0}25.00%{opacity:0}50.00%{opacity:0}75.00%{opacity:1}100%{opacity:0}}.h_ok{animation:h_ok 12s step-end infinite}
@media (prefers-reduced-motion:reduce){.cap,.hl{animation:none;opacity:0}.static{opacity:1}}
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<line class="ar" x1="240" y1="75" x2="268" y2="75" marker-end="url(#m)"/><line class="ar" x1="490" y1="75" x2="518" y2="75" marker-end="url(#m)"/><line class="ar" x1="240" y1="225" x2="268" y2="225" marker-end="url(#m)"/><line class="ar" x1="490" y1="225" x2="518" y2="225" marker-end="url(#m)"/>
<rect class="hl h_r" x="16" y="36" width="228" height="78" rx="13"/><rect class="box " x="20" y="40" width="220" height="70" rx="10"/><text class="t" x="130" y="72" text-anchor="middle">Motyw rodzic</text><text class="s" x="130" y="92" text-anchor="middle">zmiany w plikach</text><rect class="hl h_a" x="266" y="36" width="228" height="78" rx="13"/><rect class="box " x="270" y="40" width="220" height="70" rx="10"/><text class="t" x="380" y="72" text-anchor="middle">Aktualizacja</text><text class="s" x="380" y="92" text-anchor="middle">nowe pliki rodzica</text><rect class="hl h_x" x="516" y="36" width="228" height="78" rx="13"/><rect class="box bad" x="520" y="40" width="220" height="70" rx="10"/><text class="t" x="630" y="72" text-anchor="middle">Zmiany znikają</text><text class="s" x="630" y="92" text-anchor="middle">nadpisane</text><rect class="hl h_p" x="16" y="186" width="228" height="78" rx="13"/><rect class="box " x="20" y="190" width="220" height="70" rx="10"/><text class="t" x="130" y="222" text-anchor="middle">Motyw potomny</text><text class="s" x="130" y="242" text-anchor="middle">Twoje zmiany</text><rect class="hl h_a2" x="266" y="186" width="228" height="78" rx="13"/><rect class="box " x="270" y="190" width="220" height="70" rx="10"/><text class="t" x="380" y="222" text-anchor="middle">Aktualizacja</text><text class="s" x="380" y="242" text-anchor="middle">tylko rodzica</text><rect class="hl h_ok" x="516" y="186" width="228" height="78" rx="13"/><rect class="box good" x="520" y="190" width="220" height="70" rx="10"/><text class="t" x="630" y="222" text-anchor="middle">Zmiany zostają</text><text class="s" x="630" y="242" text-anchor="middle">potomny nietknięty</text>
<text class="cap c0" x="380" y="310" text-anchor="middle">1. Zmieniasz pliki motywu rodzica bezpośrednio</text><text class="cap c1" x="380" y="310" text-anchor="middle">2. Aktualizacja motywu podmienia pliki i Twoje zmiany znikają</text><text class="cap c2" x="380" y="310" text-anchor="middle">3. Z motywem potomnym zmiany są w osobnym folderze</text><text class="cap c3" x="380" y="310" text-anchor="middle">4. Aktualizacja zmienia tylko rodzica, a Twoje zmiany zostają</text>
<text class="static" x="380" y="310" text-anchor="middle">Zmiany w rodzicu znikają po aktualizacji, zmiany w motywie potomnym zostają</text>
</svg>
