<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title">
<title id="title">Robots.txt i mapa witryny: robot najpierw czyta robots.txt, który mówi, gdzie nie wchodzić, a mapa witryny podaje listę stron do odwiedzenia</title>
<style>
svg{--fg:#1d1d1b;--muted:#6b6b66;--box:#ffffff;--line:#c9c9c1;--accent:#2b6cb0;--site:#2f8f4e;--bad:#c0392b;font-family:system-ui,sans-serif}
@media (prefers-color-scheme:dark){svg{--fg:#ecece6;--muted:#a0a09a;--box:#1f1f1d;--line:#4a4a44;--accent:#63a4ec;--site:#5cbf7d;--bad:#ec7f72}}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.box.good{stroke:var(--site);stroke-width:2}
.box.bad{stroke:var(--bad);stroke-width:2}
.t{fill:var(--fg);font-size:16px;font-weight:700}
.s{fill:var(--muted);font-size:13px}
.ar{stroke:var(--line);stroke-width:2}
#m path{fill:var(--line)}
.tag{fill:var(--accent);font-size:14px;font-weight:700}
.tag.good{fill:var(--site)}
.tag.bad{fill:var(--bad)}
.hl{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.cap{fill:var(--fg);font-size:15px;opacity:0}
.static{fill:var(--muted);font-size:14px;opacity:0}
@keyframes c0{0%{opacity:0}0.00%{opacity:1}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.c0{animation:c0 15s step-end infinite}@keyframes c1{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:1}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.c1{animation:c1 15s step-end infinite}@keyframes c2{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:1}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.c2{animation:c2 15s step-end infinite}@keyframes c3{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:1}80.00%{opacity:0}100%{opacity:0}}.c3{animation:c3 15s step-end infinite}@keyframes c4{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:1}100%{opacity:0}}.c4{animation:c4 15s step-end infinite}@keyframes h_g{0%{opacity:0}0.00%{opacity:1}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.h_g{animation:h_g 15s step-end infinite}@keyframes h_r{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:1}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.h_r{animation:h_r 15s step-end infinite}@keyframes h_s{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:1}80.00%{opacity:0}100%{opacity:0}}.h_s{animation:h_s 15s step-end infinite}@keyframes h_c{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:1}100%{opacity:0}}.h_c{animation:h_c 15s step-end infinite}@keyframes h_b{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:1}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.h_b{animation:h_b 15s step-end infinite}
@media (prefers-reduced-motion:reduce){.cap,.hl{animation:none;opacity:0}.static{opacity:1}}
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<line class="ar" x1="180" y1="75" x2="298" y2="75" marker-end="url(#m)"/><text class="s" x="239" y="67" text-anchor="middle">najpierw</text><line class="ar" x1="460" y1="75" x2="578" y2="75" marker-end="url(#m)"/><text class="s" x="519" y="67" text-anchor="middle">Sitemap:</text><line class="ar" x1="660" y1="110" x2="660" y2="188" marker-end="url(#m)"/><line class="ar" x1="380" y1="110" x2="380" y2="188" marker-end="url(#m)"/><text class="s" x="380" y="102" text-anchor="middle">Disallow</text>
<rect class="hl h_g" x="16" y="36" width="168" height="78" rx="13"/><rect class="box " x="20" y="40" width="160" height="70" rx="10"/><text class="t" x="100" y="72" text-anchor="middle">Googlebot</text><text class="s" x="100" y="92" text-anchor="middle">wchodzi na domenę</text><rect class="hl h_r" x="296" y="36" width="168" height="78" rx="13"/><rect class="box " x="300" y="40" width="160" height="70" rx="10"/><text class="t" x="380" y="72" text-anchor="middle">robots.txt</text><text class="s" x="380" y="92" text-anchor="middle">gdzie nie wchodzić</text><rect class="hl h_s" x="576" y="36" width="168" height="78" rx="13"/><rect class="box good" x="580" y="40" width="160" height="70" rx="10"/><text class="t" x="660" y="72" text-anchor="middle">sitemap.xml</text><text class="s" x="660" y="92" text-anchor="middle">lista ważnych stron</text><rect class="hl h_c" x="576" y="186" width="168" height="78" rx="13"/><rect class="box " x="580" y="190" width="160" height="70" rx="10"/><text class="t" x="660" y="222" text-anchor="middle">Crawling</text><text class="s" x="660" y="242" text-anchor="middle">odwiedza strony</text><rect class="hl h_b" x="296" y="186" width="168" height="78" rx="13"/><rect class="box bad" x="300" y="190" width="160" height="70" rx="10"/><text class="t" x="380" y="222" text-anchor="middle">Zablokowane</text><text class="s" x="380" y="242" text-anchor="middle">np. /wp-admin/</text>
<text class="cap c0" x="380" y="310" text-anchor="middle">1. Robot Google wchodzi na domenę</text><text class="cap c1" x="380" y="310" text-anchor="middle">2. Najpierw czyta /robots.txt: zasady, czego nie odwiedzać</text><text class="cap c2" x="380" y="310" text-anchor="middle">3. Ścieżki z Disallow pomija, np. panel administracyjny</text><text class="cap c3" x="380" y="310" text-anchor="middle">4. Z robots.txt i z Search Console dowiaduje się o mapie witryny</text><text class="cap c4" x="380" y="310" text-anchor="middle">5. Odwiedza strony z mapy i z linków</text>
<text class="static" x="380" y="310" text-anchor="middle">Googlebot → robots.txt (zakazy) → sitemap.xml (lista) → odwiedzanie stron</text>
</svg>
