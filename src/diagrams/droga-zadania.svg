<text class="cap c0" x="380" y="312" text-anchor="middle">1. Przeglądarka pyta DNS: jaki IP ma mojafirma.pl?</text><text class="cap c1" x="380" y="312" text-anchor="middle">2. DNS odpowiada: 93.184.215.14</text><text class="cap c2" x="380" y="312" text-anchor="middle">3. Przeglądarka łączy się z serwerem (HTTPS, port 443)</text><text class="cap c3" x="380" y="312" text-anchor="middle">4. PHP pobiera treść z bazy danych</text><text class="cap c4" x="380" y="312" text-anchor="middle">5. Baza zwraca wpisy i ustawienia</text><text class="cap c5" x="380" y="312" text-anchor="middle">6. Serwer odsyła 200 OK + gotowy HTML</text>
