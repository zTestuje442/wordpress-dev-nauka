<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title">
<title id="title">Elementor: kontenery układają sekcje, widżety to elementy treści, szablony pozwalają powtarzać układy, a każdy dodatek wpływa na szybkość</title>
<style>
svg{--fg:#1d1d1b;--muted:#6b6b66;--box:#ffffff;--line:#c9c9c1;--accent:#2b6cb0;--site:#2f8f4e;--bad:#c0392b;font-family:system-ui,sans-serif}
@media (prefers-color-scheme:dark){svg{--fg:#ecece6;--muted:#a0a09a;--box:#1f1f1d;--line:#4a4a44;--accent:#63a4ec;--site:#5cbf7d;--bad:#ec7f72}}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.box.good{stroke:var(--site);stroke-width:2}
.box.bad{stroke:var(--bad);stroke-width:2}
.t{fill:var(--fg);font-size:16px;font-weight:700}
.s{fill:var(--muted);font-size:13px}
.ar{stroke:var(--line);stroke-width:2}
#m path{fill:var(--line)}
.tag{fill:var(--accent);font-size:14px;font-weight:700}
.tag.good{fill:var(--site)}
.tag.bad{fill:var(--bad)}
.hl{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.cap{fill:var(--fg);font-size:15px;opacity:0}
.static{fill:var(--muted);font-size:14px;opacity:0}
</style>

<rect class="box " x="20" y="20" width="168" height="210" rx="12"/>
<text class="t" x="104" y="52" text-anchor="middle">Kontener</text>
<text class="s" x="104" y="84" text-anchor="middle">pudełko na sekcję</text>
<text class="s" x="104" y="104" text-anchor="middle">kierunek: rząd</text>
<text class="s" x="104" y="124" text-anchor="middle">lub kolumna</text>
<text class="s" x="104" y="144" text-anchor="middle">kontenery</text>
<text class="s" x="104" y="164" text-anchor="middle">w kontenerach</text>
<text class="tag " x="104" y="212" text-anchor="middle">układ</text>
<rect class="box " x="204" y="20" width="168" height="210" rx="12"/>
<text class="t" x="288" y="52" text-anchor="middle">Widżet</text>
<text class="s" x="288" y="84" text-anchor="middle">nagłówek, tekst,</text>
<text class="s" x="288" y="104" text-anchor="middle">obraz, przycisk,</text>
<text class="s" x="288" y="124" text-anchor="middle">formularz, galeria</text>
<text class="s" x="288" y="144" text-anchor="middle">przeciągasz</text>
<text class="s" x="288" y="164" text-anchor="middle">do kontenera</text>
<text class="tag " x="288" y="212" text-anchor="middle">treść</text>
<rect class="box good" x="388" y="20" width="168" height="210" rx="12"/>
<text class="t" x="472" y="52" text-anchor="middle">Szablon</text>
<text class="s" x="472" y="84" text-anchor="middle">zapisana sekcja</text>
<text class="s" x="472" y="104" text-anchor="middle">lub strona</text>
<text class="s" x="472" y="124" text-anchor="middle">Kit: kolory i fonty</text>
<text class="s" x="472" y="144" text-anchor="middle">globalne</text>
<text class="s" x="472" y="164" text-anchor="middle">(Ustawienia witryny)</text>
<text class="tag good" x="472" y="212" text-anchor="middle">powtarzanie</text>
<rect class="box bad" x="572" y="20" width="168" height="210" rx="12"/>
<text class="t" x="656" y="52" text-anchor="middle">Szybkość</text>
<text class="s" x="656" y="84" text-anchor="middle">każdy widżet</text>
<text class="s" x="656" y="104" text-anchor="middle">dodaje kod</text>
<text class="s" x="656" y="124" text-anchor="middle">mniej zagnieżdżeń</text>
<text class="s" x="656" y="144" text-anchor="middle">motyw Hello</text>
<text class="s" x="656" y="164" text-anchor="middle">funkcje wydajności</text>
<text class="tag bad" x="656" y="212" text-anchor="middle">uważaj</text>
</svg>
