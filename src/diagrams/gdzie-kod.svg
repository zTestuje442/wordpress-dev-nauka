<text class="tag good" x="104" y="212" text-anchor="middle">wygląd</text>
<rect class="box good" x="204" y="20" width="168" height="210" rx="12"/>
<text class="t" x="288" y="52" text-anchor="middle">Code Snippets</text>
<text class="s" x="288" y="84" text-anchor="middle">PHP, CSS, JS</text>
<text class="s" x="288" y="104" text-anchor="middle">osobne fragmenty</text>
<text class="s" x="288" y="124" text-anchor="middle">włącz / wyłącz</text>
<text class="s" x="288" y="144" text-anchor="middle">ochrona przed</text>
<text class="s" x="288" y="164" text-anchor="middle">błędem krytycznym</text>
<text class="tag good" x="288" y="212" text-anchor="middle">polecane</text>
<rect class="box " x="388" y="20" width="168" height="210" rx="12"/>
<text class="t" x="472" y="52" text-anchor="middle">Motyw potomny</text>
<text class="s" x="472" y="84" text-anchor="middle">functions.php</text>
<text class="s" x="472" y="104" text-anchor="middle">style.css</text>
