<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title">
<title id="title">Obraz pod SEO: dobra nazwa pliku, zmniejszenie i kompresja do WebP, opis alt, a na stronie lazy loading poniżej pierwszego ekranu</title>
<style>
svg{--fg:#1d1d1b;--muted:#6b6b66;--box:#ffffff;--line:#c9c9c1;--accent:#2b6cb0;--site:#2f8f4e;--bad:#c0392b;font-family:system-ui,sans-serif}
@media (prefers-color-scheme:dark){svg{--fg:#ecece6;--muted:#a0a09a;--box:#1f1f1d;--line:#4a4a44;--accent:#63a4ec;--site:#5cbf7d;--bad:#ec7f72}}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.box.good{stroke:var(--site);stroke-width:2}
.box.bad{stroke:var(--bad);stroke-width:2}
.t{fill:var(--fg);font-size:16px;font-weight:700}
.s{fill:var(--muted);font-size:13px}
.ar{stroke:var(--line);stroke-width:2}
#m path{fill:var(--line)}
.tag{fill:var(--accent);font-size:14px;font-weight:700}
.tag.good{fill:var(--site)}
.tag.bad{fill:var(--bad)}
.hl{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.cap{fill:var(--fg);font-size:15px;opacity:0}
.static{fill:var(--muted);font-size:14px;opacity:0}
@keyframes c0{0%{opacity:0}0.00%{opacity:1}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.c0{animation:c0 15s step-end infinite}@keyframes c1{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:1}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.c1{animation:c1 15s step-end infinite}@keyframes c2{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:1}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.c2{animation:c2 15s step-end infinite}@keyframes c3{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:1}80.00%{opacity:0}100%{opacity:0}}.c3{animation:c3 15s step-end infinite}@keyframes c4{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:1}100%{opacity:0}}.c4{animation:c4 15s step-end infinite}@keyframes h_p{0%{opacity:0}0.00%{opacity:1}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.h_p{animation:h_p 15s step-end infinite}@keyframes h_n{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:1}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.h_n{animation:h_n 15s step-end infinite}@keyframes h_r{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:1}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.h_r{animation:h_r 15s step-end infinite}@keyframes h_a{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:1}80.00%{opacity:0}100%{opacity:0}}.h_a{animation:h_a 15s step-end infinite}@keyframes h_l{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:1}100%{opacity:0}}.h_l{animation:h_l 15s step-end infinite}
@media (prefers-reduced-motion:reduce){.cap,.hl{animation:none;opacity:0}.static{opacity:1}}
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<line class="ar" x1="180" y1="75" x2="298" y2="75" marker-end="url(#m)"/><line class="ar" x1="460" y1="75" x2="578" y2="75" marker-end="url(#m)"/><line class="ar" x1="660" y1="110" x2="660" y2="188" marker-end="url(#m)"/><line class="ar" x1="578" y1="225" x2="462" y2="225" marker-end="url(#m)"/>
<rect class="hl h_p" x="16" y="36" width="168" height="78" rx="13"/><rect class="box bad" x="20" y="40" width="160" height="70" rx="10"/><text class="t" x="100" y="72" text-anchor="middle">Zdjęcie z aparatu</text><text class="s" x="100" y="92" text-anchor="middle">IMG_4521.jpg, 6 MB</text><rect class="hl h_n" x="296" y="36" width="168" height="78" rx="13"/><rect class="box " x="300" y="40" width="160" height="70" rx="10"/><text class="t" x="380" y="72" text-anchor="middle">Nazwa pliku</text><text class="s" x="380" y="92" text-anchor="middle">remont-lazienki.jpg</text><rect class="hl h_r" x="576" y="36" width="168" height="78" rx="13"/><rect class="box " x="580" y="40" width="160" height="70" rx="10"/><text class="t" x="660" y="72" text-anchor="middle">Rozmiar i format</text><text class="s" x="660" y="92" text-anchor="middle">1600 px, WebP, 150 KB</text><rect class="hl h_a" x="576" y="186" width="168" height="78" rx="13"/><rect class="box " x="580" y="190" width="160" height="70" rx="10"/><text class="t" x="660" y="222" text-anchor="middle">Tekst alt</text><text class="s" x="660" y="242" text-anchor="middle">opis dla Google i czytnika</text><rect class="hl h_l" x="296" y="186" width="168" height="78" rx="13"/><rect class="box good" x="300" y="190" width="160" height="70" rx="10"/><text class="t" x="380" y="222" text-anchor="middle">Na stronie</text><text class="s" x="380" y="242" text-anchor="middle">lazy loading</text>
<text class="cap c0" x="380" y="310" text-anchor="middle">1. Zdjęcie prosto z telefonu waży kilka MB i ma nic nie mówiącą nazwę</text><text class="cap c1" x="380" y="310" text-anchor="middle">2. Zmieniasz nazwę pliku na opisową, przed wgraniem</text><text class="cap c2" x="380" y="310" text-anchor="middle">3. Zmniejszasz do potrzebnej szerokości i kompresujesz do WebP</text><text class="cap c3" x="380" y="310" text-anchor="middle">4. Dodajesz tekst alternatywny opisujący, co jest na zdjęciu</text><text class="cap c4" x="380" y="310" text-anchor="middle">5. Obrazy poniżej pierwszego ekranu ładują się dopiero przy przewijaniu</text>
<text class="static" x="380" y="310" text-anchor="middle">Nazwa pliku → rozmiar i WebP → alt → lazy loading</text>
</svg>
