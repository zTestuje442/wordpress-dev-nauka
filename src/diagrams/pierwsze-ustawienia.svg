<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title">
<title id="title">Pierwsze ustawienia WordPressa w czterech miejscach: Ogólne, Czytanie, Bezpośrednie odnośniki i Dyskusja</title>
<style>
svg{--fg:#1d1d1b;--muted:#6b6b66;--box:#ffffff;--line:#c9c9c1;--accent:#2b6cb0;--site:#2f8f4e;--bad:#c0392b;font-family:system-ui,sans-serif}
@media (prefers-color-scheme:dark){svg{--fg:#ecece6;--muted:#a0a09a;--box:#1f1f1d;--line:#4a4a44;--accent:#63a4ec;--site:#5cbf7d;--bad:#ec7f72}}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.box.good{stroke:var(--site);stroke-width:2}
.box.bad{stroke:var(--bad);stroke-width:2}
.t{fill:var(--fg);font-size:16px;font-weight:700}
.s{fill:var(--muted);font-size:13px}
.ar{stroke:var(--line);stroke-width:2}
#m path{fill:var(--line)}
.tag{fill:var(--accent);font-size:14px;font-weight:700}
.tag.good{fill:var(--site)}
.tag.bad{fill:var(--bad)}
.hl{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.cap{fill:var(--fg);font-size:15px;opacity:0}
.static{fill:var(--muted);font-size:14px;opacity:0}
</style>

<rect class="box " x="20" y="20" width="168" height="210" rx="12"/>
<text class="t" x="104" y="52" text-anchor="middle">Ogólne</text>
<text class="s" x="104" y="84" text-anchor="middle">tytuł i opis strony</text>
<text class="s" x="104" y="104" text-anchor="middle">e-mail administratora</text>
<text class="s" x="104" y="124" text-anchor="middle">język: polski</text>
<text class="s" x="104" y="144" text-anchor="middle">strefa: Warszawa</text>
<text class="s" x="104" y="164" text-anchor="middle">format daty</text>
<text class="tag " x="104" y="212" text-anchor="middle">kto i gdzie</text>
<rect class="box " x="204" y="20" width="168" height="210" rx="12"/>
<text class="t" x="288" y="52" text-anchor="middle">Czytanie</text>
<text class="s" x="288" y="84" text-anchor="middle">strona główna:</text>
<text class="s" x="288" y="104" text-anchor="middle">statyczna strona</text>
<text class="s" x="288" y="124" text-anchor="middle">strona wpisów: Blog</text>
<text class="s" x="288" y="144" text-anchor="middle">widoczność dla</text>
<text class="s" x="288" y="164" text-anchor="middle">wyszukiwarek</text>
<text class="tag " x="288" y="212" text-anchor="middle">co na start</text>
<rect class="box good" x="388" y="20" width="168" height="210" rx="12"/>
<text class="t" x="472" y="52" text-anchor="middle">Odnośniki</text>
<text class="s" x="472" y="84" text-anchor="middle">Ustawienia →</text>
<text class="s" x="472" y="104" text-anchor="middle">Bezpośrednie odnośniki</text>
<text class="s" x="472" y="124" text-anchor="middle">wybierz</text>
<text class="s" x="472" y="144" text-anchor="middle">„Nazwa wpisu”</text>
<text class="s" x="472" y="164" text-anchor="middle">/%postname%/</text>
<text class="tag good" x="472" y="212" text-anchor="middle">ładne adresy</text>
<rect class="box " x="572" y="20" width="168" height="210" rx="12"/>
<text class="t" x="656" y="52" text-anchor="middle">Dyskusja</text>
<text class="s" x="656" y="84" text-anchor="middle">komentarze</text>
<text class="s" x="656" y="104" text-anchor="middle">włączone lub nie</text>
<text class="s" x="656" y="124" text-anchor="middle">moderacja</text>
<text class="s" x="656" y="144" text-anchor="middle">pierwszego</text>
<text class="s" x="656" y="164" text-anchor="middle">komentarza</text>
<text class="tag " x="656" y="212" text-anchor="middle">mniej spamu</text>
</svg>
