<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title">
<title id="title">Dobre studium przypadku w portfolio: problem klienta, rozwiązanie, wynik w liczbach i dowody, a GitHub jako miejsce na kod i notatki</title>
<style>
svg{--fg:#1d1d1b;--muted:#6b6b66;--box:#ffffff;--line:#c9c9c1;--accent:#2b6cb0;--site:#2f8f4e;--bad:#c0392b;font-family:system-ui,sans-serif}
@media (prefers-color-scheme:dark){svg{--fg:#ecece6;--muted:#a0a09a;--box:#1f1f1d;--line:#4a4a44;--accent:#63a4ec;--site:#5cbf7d;--bad:#ec7f72}}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.box.good{stroke:var(--site);stroke-width:2}
.box.bad{stroke:var(--bad);stroke-width:2}
.t{fill:var(--fg);font-size:16px;font-weight:700}
.s{fill:var(--muted);font-size:13px}
.ar{stroke:var(--line);stroke-width:2}
#m path{fill:var(--line)}
.tag{fill:var(--accent);font-size:14px;font-weight:700}
.tag.good{fill:var(--site)}
.tag.bad{fill:var(--bad)}
.hl{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.cap{fill:var(--fg);font-size:15px;opacity:0}
.static{fill:var(--muted);font-size:14px;opacity:0}
</style>

<rect class="box " x="20" y="20" width="168" height="210" rx="12"/>
<text class="t" x="104" y="52" text-anchor="middle">Problem</text>
<text class="s" x="104" y="84" text-anchor="middle">kim jest klient</text>
<text class="s" x="104" y="104" text-anchor="middle">co nie działało</text>
<text class="s" x="104" y="124" text-anchor="middle">np. wolna strona,</text>
<text class="s" x="104" y="144" text-anchor="middle">brak zapytań</text>
<text class="s" x="104" y="164" text-anchor="middle"></text>
<text class="tag " x="104" y="212" text-anchor="middle">przed</text>
<rect class="box " x="204" y="20" width="168" height="210" rx="12"/>
<text class="t" x="288" y="52" text-anchor="middle">Rozwiązanie</text>
<text class="s" x="288" y="84" text-anchor="middle">co zrobiono</text>
<text class="s" x="288" y="104" text-anchor="middle">jakie narzędzia</text>
<text class="s" x="288" y="124" text-anchor="middle">WordPress, Woo,</text>
<text class="s" x="288" y="144" text-anchor="middle">Elementor, SEO</text>
<text class="s" x="288" y="164" text-anchor="middle">ile trwało</text>
<text class="tag " x="288" y="212" text-anchor="middle">jak</text>
<rect class="box good" x="388" y="20" width="168" height="210" rx="12"/>
<text class="t" x="472" y="52" text-anchor="middle">Wynik</text>
<text class="s" x="472" y="84" text-anchor="middle">liczby:</text>
<text class="s" x="472" y="104" text-anchor="middle">PageSpeed 41 → 88</text>
<text class="s" x="472" y="124" text-anchor="middle">zapytania +60%</text>
<text class="s" x="472" y="144" text-anchor="middle">pozycje, ruch</text>
<text class="s" x="472" y="164" text-anchor="middle">opinia klienta</text>
<text class="tag good" x="472" y="212" text-anchor="middle">po</text>
<rect class="box " x="572" y="20" width="168" height="210" rx="12"/>
<text class="t" x="656" y="52" text-anchor="middle">GitHub</text>
<text class="s" x="656" y="84" text-anchor="middle">repozytorium</text>
<text class="s" x="656" y="104" text-anchor="middle">fragmenty kodu</text>
<text class="s" x="656" y="124" text-anchor="middle">motyw potomny</text>
<text class="s" x="656" y="144" text-anchor="middle">README z opisem</text>
<text class="s" x="656" y="164" text-anchor="middle">historia zmian</text>
<text class="tag " x="656" y="212" text-anchor="middle">warsztat</text>
</svg>
