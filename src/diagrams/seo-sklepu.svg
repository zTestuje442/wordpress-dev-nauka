<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title">
<title id="title">SEO sklepu: kategorie są celem dla fraz ogólnych, filtry nie powinny tworzyć tysięcy indeksowanych adresów, produkty niedostępne zostają lub dostają 301, a schema Product daje cenę w wynikach</title>
<style>
svg{--fg:#1d1d1b;--muted:#6b6b66;--box:#ffffff;--line:#c9c9c1;--accent:#2b6cb0;--site:#2f8f4e;--bad:#c0392b;font-family:system-ui,sans-serif}
@media (prefers-color-scheme:dark){svg{--fg:#ecece6;--muted:#a0a09a;--box:#1f1f1d;--line:#4a4a44;--accent:#63a4ec;--site:#5cbf7d;--bad:#ec7f72}}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.box.good{stroke:var(--site);stroke-width:2}
.box.bad{stroke:var(--bad);stroke-width:2}
.t{fill:var(--fg);font-size:16px;font-weight:700}
.s{fill:var(--muted);font-size:13px}
.ar{stroke:var(--line);stroke-width:2}
#m path{fill:var(--line)}
.tag{fill:var(--accent);font-size:14px;font-weight:700}
.tag.good{fill:var(--site)}
.tag.bad{fill:var(--bad)}
.hl{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.cap{fill:var(--fg);font-size:15px;opacity:0}
.static{fill:var(--muted);font-size:14px;opacity:0}
</style>

<rect class="box good" x="20" y="20" width="168" height="210" rx="12"/>
<text class="t" x="104" y="52" text-anchor="middle">Kategorie</text>
<text class="s" x="104" y="84" text-anchor="middle">frazy ogólne</text>
<text class="s" x="104" y="104" text-anchor="middle">„płytki matowe”</text>
<text class="s" x="104" y="124" text-anchor="middle">opis, title</text>
<text class="s" x="104" y="144" text-anchor="middle">linki wewnętrzne</text>
<text class="s" x="104" y="164" text-anchor="middle"></text>
<text class="tag good" x="104" y="212" text-anchor="middle">indeksuj</text>
<rect class="box bad" x="204" y="20" width="168" height="210" rx="12"/>
<text class="t" x="288" y="52" text-anchor="middle">Filtry</text>
<text class="s" x="288" y="84" text-anchor="middle">?kolor=grafit</text>
<text class="s" x="288" y="104" text-anchor="middle">&amp;rozmiar=60</text>
<text class="s" x="288" y="124" text-anchor="middle">tysiące adresów</text>
<text class="s" x="288" y="144" text-anchor="middle">noindex lub</text>
<text class="s" x="288" y="164" text-anchor="middle">canonical</text>
<text class="tag bad" x="288" y="212" text-anchor="middle">kontroluj</text>
<rect class="box " x="388" y="20" width="168" height="210" rx="12"/>
<text class="t" x="472" y="52" text-anchor="middle">Niedostępne</text>
<text class="s" x="472" y="84" text-anchor="middle">chwilowo: zostaw</text>
<text class="s" x="472" y="104" text-anchor="middle">z informacją</text>
<text class="s" x="472" y="124" text-anchor="middle">na zawsze: 301</text>
<text class="s" x="472" y="144" text-anchor="middle">do następcy lub</text>
<text class="s" x="472" y="164" text-anchor="middle">kategorii</text>
<text class="tag " x="472" y="212" text-anchor="middle">decyzja</text>
<rect class="box good" x="572" y="20" width="168" height="210" rx="12"/>
<text class="t" x="656" y="52" text-anchor="middle">Schema Product</text>
<text class="s" x="656" y="84" text-anchor="middle">cena, waluta</text>
<text class="s" x="656" y="104" text-anchor="middle">dostępność</text>
<text class="s" x="656" y="124" text-anchor="middle">oceny</text>
<text class="s" x="656" y="144" text-anchor="middle">Merchant Center</text>
<text class="s" x="656" y="164" text-anchor="middle">(tydzień 12)</text>
<text class="tag good" x="656" y="212" text-anchor="middle">wyniki</text>
</svg>
