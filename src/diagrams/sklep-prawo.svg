<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title">
<title id="title">Sklep a prawo i maile: maile zamówień przez SMTP, regulamin z prawem odstąpienia, zasada Omnibus przy promocjach i jasny przycisk zamówienia</title>
<style>
svg{--fg:#1d1d1b;--muted:#6b6b66;--box:#ffffff;--line:#c9c9c1;--accent:#2b6cb0;--site:#2f8f4e;--bad:#c0392b;font-family:system-ui,sans-serif}
@media (prefers-color-scheme:dark){svg{--fg:#ecece6;--muted:#a0a09a;--box:#1f1f1d;--line:#4a4a44;--accent:#63a4ec;--site:#5cbf7d;--bad:#ec7f72}}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.box.good{stroke:var(--site);stroke-width:2}
.box.bad{stroke:var(--bad);stroke-width:2}
.t{fill:var(--fg);font-size:16px;font-weight:700}
.s{fill:var(--muted);font-size:13px}
.ar{stroke:var(--line);stroke-width:2}
#m path{fill:var(--line)}
.tag{fill:var(--accent);font-size:14px;font-weight:700}
.tag.good{fill:var(--site)}
.tag.bad{fill:var(--bad)}
.hl{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.cap{fill:var(--fg);font-size:15px;opacity:0}
.static{fill:var(--muted);font-size:14px;opacity:0}
</style>

<rect class="box good" x="20" y="20" width="168" height="210" rx="12"/>
<text class="t" x="104" y="52" text-anchor="middle">Maile</text>
<text class="s" x="104" y="84" text-anchor="middle">nowe zamówienie</text>
<text class="s" x="104" y="104" text-anchor="middle">w realizacji</text>
<text class="s" x="104" y="124" text-anchor="middle">zrealizowane</text>
<text class="s" x="104" y="144" text-anchor="middle">wysyłka przez SMTP</text>
<text class="s" x="104" y="164" text-anchor="middle">nie trafiają do spamu</text>
<text class="tag good" x="104" y="212" text-anchor="middle">SMTP</text>
<rect class="box " x="204" y="20" width="168" height="210" rx="12"/>
<text class="t" x="288" y="52" text-anchor="middle">Regulamin</text>
<text class="s" x="288" y="84" text-anchor="middle">dane sprzedawcy</text>
<text class="s" x="288" y="104" text-anchor="middle">zamówienia, płatności</text>
<text class="s" x="288" y="124" text-anchor="middle">dostawa, reklamacje</text>
<text class="s" x="288" y="144" text-anchor="middle">odstąpienie 14 dni</text>
<text class="s" x="288" y="164" text-anchor="middle">akceptacja w kasie</text>
<text class="tag " x="288" y="212" text-anchor="middle">obowiązkowy</text>
<rect class="box " x="388" y="20" width="168" height="210" rx="12"/>
<text class="t" x="472" y="52" text-anchor="middle">Omnibus</text>
<text class="s" x="472" y="84" text-anchor="middle">przy obniżce</text>
<text class="s" x="472" y="104" text-anchor="middle">najniższa cena</text>
<text class="s" x="472" y="124" text-anchor="middle">z 30 dni</text>
<text class="s" x="472" y="144" text-anchor="middle">przed obniżką</text>
<text class="s" x="472" y="164" text-anchor="middle">widoczna przy cenie</text>
<text class="tag " x="472" y="212" text-anchor="middle">promocje</text>
<rect class="box " x="572" y="20" width="168" height="210" rx="12"/>
<text class="t" x="656" y="52" text-anchor="middle">Przycisk</text>
<text class="s" x="656" y="84" text-anchor="middle">„Zamawiam</text>
<text class="s" x="656" y="104" text-anchor="middle">z obowiązkiem</text>
<text class="s" x="656" y="124" text-anchor="middle">zapłaty”</text>
<text class="s" x="656" y="144" text-anchor="middle">lub podobny</text>
<text class="s" x="656" y="164" text-anchor="middle">jasny napis</text>
<text class="tag " x="656" y="212" text-anchor="middle">kasa</text>
</svg>
