<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title">
<title id="title">Wielojęzyczność: każda strona ma wersję w drugim języku pod własnym adresem, tagi hreflang łączą wersje, a przełącznik języka prowadzi do odpowiednika</title>
<style>
svg{--fg:#1d1d1b;--muted:#6b6b66;--box:#ffffff;--line:#c9c9c1;--accent:#2b6cb0;--site:#2f8f4e;--bad:#c0392b;font-family:system-ui,sans-serif}
@media (prefers-color-scheme:dark){svg{--fg:#ecece6;--muted:#a0a09a;--box:#1f1f1d;--line:#4a4a44;--accent:#63a4ec;--site:#5cbf7d;--bad:#ec7f72}}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.box.good{stroke:var(--site);stroke-width:2}
.box.bad{stroke:var(--bad);stroke-width:2}
.t{fill:var(--fg);font-size:16px;font-weight:700}
.s{fill:var(--muted);font-size:13px}
.ar{stroke:var(--line);stroke-width:2}
#m path{fill:var(--line)}
.tag{fill:var(--accent);font-size:14px;font-weight:700}
.tag.good{fill:var(--site)}
.tag.bad{fill:var(--bad)}
.hl{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.cap{fill:var(--fg);font-size:15px;opacity:0}
.static{fill:var(--muted);font-size:14px;opacity:0}
@keyframes c0{0%{opacity:0}0.00%{opacity:1}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.c0{animation:c0 15s step-end infinite}@keyframes c1{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:1}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.c1{animation:c1 15s step-end infinite}@keyframes c2{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:1}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.c2{animation:c2 15s step-end infinite}@keyframes c3{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:1}80.00%{opacity:0}100%{opacity:0}}.c3{animation:c3 15s step-end infinite}@keyframes c4{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:1}100%{opacity:0}}.c4{animation:c4 15s step-end infinite}@keyframes h_pl{0%{opacity:0}0.00%{opacity:1}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.h_pl{animation:h_pl 15s step-end infinite}@keyframes h_en{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:1}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.h_en{animation:h_en 15s step-end infinite}@keyframes h_h{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:1}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:0}100%{opacity:0}}.h_h{animation:h_h 15s step-end infinite}@keyframes h_g{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:1}80.00%{opacity:0}100%{opacity:0}}.h_g{animation:h_g 15s step-end infinite}@keyframes h_p{0%{opacity:0}0.00%{opacity:0}20.00%{opacity:0}40.00%{opacity:0}60.00%{opacity:0}80.00%{opacity:1}100%{opacity:0}}.h_p{animation:h_p 15s step-end infinite}
@media (prefers-reduced-motion:reduce){.cap,.hl{animation:none;opacity:0}.static{opacity:1}}
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<line class="ar" x1="180" y1="75" x2="298" y2="75" marker-end="url(#m)"/><line class="ar" x1="460" y1="75" x2="578" y2="75" marker-end="url(#m)"/><line class="ar" x1="660" y1="110" x2="660" y2="188" marker-end="url(#m)"/><line class="ar" x1="578" y1="225" x2="462" y2="225" marker-end="url(#m)"/>
<rect class="hl h_pl" x="16" y="36" width="168" height="78" rx="13"/><rect class="box " x="20" y="40" width="160" height="70" rx="10"/><text class="t" x="100" y="72" text-anchor="middle">Wersja PL</text><text class="s" x="100" y="92" text-anchor="middle">/oferta/remont-lazienki/</text><rect class="hl h_en" x="576" y="36" width="168" height="78" rx="13"/><rect class="box " x="580" y="40" width="160" height="70" rx="10"/><text class="t" x="660" y="72" text-anchor="middle">Wersja EN</text><text class="s" x="660" y="92" text-anchor="middle">/en/bathroom/</text><rect class="hl h_h" x="296" y="36" width="168" height="78" rx="13"/><rect class="box " x="300" y="40" width="160" height="70" rx="10"/><text class="t" x="380" y="72" text-anchor="middle">hreflang</text><text class="s" x="380" y="92" text-anchor="middle">łączy wersje</text><rect class="hl h_g" x="576" y="186" width="168" height="78" rx="13"/><rect class="box good" x="580" y="190" width="160" height="70" rx="10"/><text class="t" x="660" y="222" text-anchor="middle">Google</text><text class="s" x="660" y="242" text-anchor="middle">daje właściwy język</text><rect class="hl h_p" x="296" y="186" width="168" height="78" rx="13"/><rect class="box " x="300" y="190" width="160" height="70" rx="10"/><text class="t" x="380" y="222" text-anchor="middle">Przełącznik</text><text class="s" x="380" y="242" text-anchor="middle">PL | EN w menu</text>
<text class="cap c0" x="380" y="310" text-anchor="middle">1. Strona istnieje po polsku pod swoim adresem</text><text class="cap c1" x="380" y="310" text-anchor="middle">2. Wtyczka dodaje tagi hreflang, które łączą wersje językowe</text><text class="cap c2" x="380" y="310" text-anchor="middle">3. Tłumaczenie ma własny adres, np. z prefiksem /en/</text><text class="cap c3" x="380" y="310" text-anchor="middle">4. Google pokazuje osobie z Niemiec czy Anglii wersję w jej języku</text><text class="cap c4" x="380" y="310" text-anchor="middle">5. Przełącznik języka prowadzi do odpowiednika, a nie na stronę główną</text>
<text class="static" x="380" y="310" text-anchor="middle">Wersja PL ↔ hreflang ↔ wersja EN; przełącznik prowadzi do odpowiednika</text>
</svg>
